<div class="mb-4">
  <h2 class="fw-bold d-flex align-items-center gap-2 mb-1">
    <i class="bi bi-house-door-fill text-dark"></i>
    <span>Panel principal</span>
  </h2>
  <p class="text-muted mb-0">Bienvenido al sistema de administración</p>
</div>

<div class="row g-4 mb-4">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm p-4 d-flex flex-row align-items-center gap-4">
      <div class="rounded-circle bg-primary bg-opacity-10 p-3 text-primary">
        <i class="bi bi-box-seam-fill fs-1"></i>
      </div>
      <div>
        <h3 class="fw-bold mb-0">{{ totalProductos }}</h3>
        <span class="text-muted">Productos registrados</span>
      </div>
    </div>
  </div>

  <div class="col-md-6">
    <div class="card border-0 shadow-sm p-4 d-flex flex-row align-items-center gap-4">
      <div class="rounded-circle bg-success bg-opacity-10 p-3 text-success">
        <i class="bi bi-tag-fill fs-1"></i>
      </div>
      <div>
        <h3 class="fw-bold mb-0">{{ totalCategorias }}</h3>
        <span class="text-muted">Categorías registradas</span>
      </div>
    </div>
  </div>
</div>

<div class="card border-0 shadow-sm p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="fw-bold mb-0 d-flex align-items-center gap-2">
      <i class="bi bi-clock"></i>
      <span>Últimos movimientos</span>
    </h5>
    <a routerLink="/productos" class="text-primary text-decoration-none fw-semibold">
      Ver todos <i class="bi bi-arrow-right"></i>
    </a>
  </div>

  <div class="table-responsive">
    <table class="table align-middle mb-0">
      <tbody>
        <tr *ngFor="let item of ultimosMovimientos">
          <td class="fw-medium">{{ item.nombre }}</td>
          <td class="text-muted">{{ item.fechaRegistro || 'Reciente' }}</td>
          <td class="text-end">
            <span class="badge rounded-pill bg-success bg-opacity-25 text-success px-3 py-2">
              {{ item.estado || 'Activo' }}
            </span>
          </td>
        </tr>
        <tr *ngIf="ultimosMovimientos.length === 0">
          <td colspan="3" class="text-center text-muted py-3">No hay movimientos registrados.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
