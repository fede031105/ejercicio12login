<h2 class="fw-bold d-flex align-items-center gap-2 mb-4">
  <i class="bi bi-box-seam-fill"></i>
  <span>Productos</span>
</h2>

<div class="card border-0 shadow-sm p-4 mb-4">
  <h5 class="fw-bold mb-3">{{ editandoId ? 'Editar producto' : 'Registrar producto' }}</h5>

  <form (ngSubmit)="guardarProducto()">
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <label class="form-label fw-semibold">Nombre *</label>
        <input
          type="text"
          class="form-control"
          placeholder="Ej. Laptop Gamer"
          name="nombre"
          [(ngModel)]="productoActual.nombre"
          required>
      </div>
      <div class="col-md-5">
        <label class="form-label fw-semibold">Descripción</label>
        <input
          type="text"
          class="form-control"
          placeholder="Descripción del producto"
          name="descripcion"
          [(ngModel)]="productoActual.descripcion">
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold">Precio *</label>
        <input
          type="number"
          step="0.01"
          class="form-control"
          placeholder="0.00"
          name="precio"
          [(ngModel)]="productoActual.precio"
          required>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary px-4 fw-semibold">
        <i class="bi bi-plus-lg me-1"></i>
        {{ editandoId ? 'Actualizar producto' : 'Guardar producto' }}
      </button>
      <button *ngIf="editandoId" type="button" (click)="resetFormulario()" class="btn btn-outline-secondary">
        Cancelar
      </button>
    </div>
  </form>
</div>

<div class="card border-0 shadow-sm p-4">
  <h5 class="fw-bold mb-3">Listado de productos</h5>

  <div class="table-responsive">
    <table class="table align-middle">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Precio</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let prod of productos">
          <td>{{ prod.id }}</td>
          <td class="fw-medium">{{ prod.nombre }}</td>
          <td>{{ prod.descripcion }}</td>
          <td>{{ prod.precio | currency }}</td>
          <td class="text-center">
            <button (click)="editar(prod)" class="btn btn-primary btn-sm me-2">
              <i class="bi bi-pencil-fill"></i>
            </button>
            <button (click)="eliminar(prod.id)" class="btn btn-danger btn-sm">
              <i class="bi bi-trash-fill"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="productos.length === 0">
          <td colspan="5" class="text-center text-muted py-3">No hay productos registrados.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
