<h2 class="fw-bold d-flex align-items-center gap-2 mb-4">
  <i class="bi bi-tag-fill"></i>
  <span>Categorías</span>
</h2>

<div class="card border-0 shadow-sm p-4 mb-4">
  <h5 class="fw-bold mb-3">{{ editandoId ? 'Editar categoría' : 'Registrar categoría' }}</h5>

  <form (ngSubmit)="guardarCategoria()">
    <div class="row g-3 mb-3">
      <div class="col-md-5">
        <label class="form-label fw-semibold">Nombre *</label>
        <input
          type="text"
          class="form-control"
          placeholder="Ej. Periféricos"
          name="nombre"
          [(ngModel)]="categoriaActual.nombre"
          required>
      </div>
      <div class="col-md-7">
        <label class="form-label fw-semibold">Descripción</label>
        <input
          type="text"
          class="form-control"
          placeholder="Descripción de la categoría"
          name="descripcion"
          [(ngModel)]="categoriaActual.descripcion">
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary px-4 fw-semibold">
        <i class="bi bi-plus-lg me-1"></i>
        {{ editandoId ? 'Actualizar categoría' : 'Guardar categoría' }}
      </button>
      <button *ngIf="editandoId" type="button" (click)="resetFormulario()" class="btn btn-outline-secondary">
        Cancelar
      </button>
    </div>
  </form>
</div>

<div class="card border-0 shadow-sm p-4">
  <h5 class="fw-bold mb-3">Listado de categorías</h5>

  <div class="table-responsive">
    <table class="table align-middle">
      <thead class="table-light">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cat of categorias">
          <td>{{ cat.id }}</td>
          <td class="fw-medium">{{ cat.nombre }}</td>
          <td>{{ cat.descripcion }}</td>
          <td class="text-center">
            <button (click)="editar(cat)" class="btn btn-primary btn-sm me-2">
              <i class="bi bi-pencil-fill"></i>
            </button>
            <button (click)="eliminar(cat.id)" class="btn btn-danger btn-sm">
              <i class="bi bi-trash-fill"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="categorias.length === 0">
          <td colspan="4" class="text-center text-muted py-3">No hay categorías registradas.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
