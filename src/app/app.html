<div *ngIf="loginService.isAuthenticated(); else loginLayout" class="d-flex min-vh-100">
  <aside class="sidebar d-flex flex-column p-3 text-white">
    <div class="d-flex align-items-center mb-4 px-2">
      <i class="bi bi-box-seam-fill fs-3 me-2"></i>
      <span class="fs-4 fw-bold">AdminPanel</span>
    </div>

    <ul class="nav nav-pills flex-column mb-auto gap-1">
      <li class="nav-item">
        <a routerLink="/principal" routerLinkActive="active" class="nav-link text-white d-flex align-items-center gap-2">
          <i class="bi bi-house-door-fill"></i>
          <span>Inicio</span>
        </a>
      </li>
      <li>
        <a routerLink="/productos" routerLinkActive="active" class="nav-link text-white d-flex align-items-center gap-2">
          <i class="bi bi-box-fill"></i>
          <span>Productos</span>
        </a>
      </li>
      <li>
        <a routerLink="/categorias" routerLinkActive="active" class="nav-link text-white d-flex align-items-center gap-2">
          <i class="bi bi-tag-fill"></i>
          <span>Categorías</span>
        </a>
      </li>
    </ul>

    <hr class="border-secondary">
    <button (click)="cerrarSesion()" class="btn btn-link text-danger text-decoration-none d-flex align-items-center gap-2 px-2">
      <i class="bi bi-box-arrow-left fs-5"></i>
      <span>Cerrar sesión</span>
    </button>
  </aside>

  <div class="flex-grow-1 d-flex flex-column bg-light">
    <header class="bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <i class="bi bi-list fs-4 text-dark"></i>
        <span class="fw-semibold fs-5 text-dark">Sistema de administración</span>
      </div>
      <div class="d-flex align-items-center gap-2 text-secondary">
        <i class="bi bi-person-circle fs-3 text-primary"></i>
        <span class="fw-medium">Administrador</span>
      </div>
    </header>

    <main class="p-4 flex-grow-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<ng-template #loginLayout>
  <router-outlet></router-outlet>
</ng-template>
